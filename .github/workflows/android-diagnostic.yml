name: Android Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: homeguard-android-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-diagnostic:
    name: Android Gradle diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Ensure stable Android debug signing key exists
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [[ ! -s "$HOME/.android/debug.keystore" ]]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi
          test -s "$HOME/.android/debug.keystore"
      - name: Build and capture diagnostics
        id: gradle
        working-directory: android
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace testDebugUnitTest assembleDebug 2>&1 | tee gradle-build.log
      - name: Surface Gradle failure lines
        if: failure()
        shell: bash
        run: |
          LOG=android/gradle-build.log
          if [[ ! -s "$LOG" ]]; then
            echo "::error::Gradle failed before a diagnostic log was produced"
            exit 0
          fi
          grep -E '(^e: |^FAILURE:|^\* What went wrong:|^Execution failed for task|Compilation error|Unresolved reference|Type mismatch|Cannot access|Exception)' "$LOG" \
            | tail -n 30 \
            | while IFS= read -r line; do
                safe=${line//'%'/'%25'}
                safe=${safe//$'\r'/'%0D'}
                safe=${safe//$'\n'/'%0A'}
                echo "::error::$safe"
              done || true
      - name: Upload Gradle diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HomeGuard-S3-Android-gradle-diagnostics
          path: |
            android/gradle-build.log
            android/app/build/reports/**
            android/app/build/test-results/**
          if-no-files-found: warn
