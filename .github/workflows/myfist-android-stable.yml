name: MyFist Android Stable

on:
  workflow_dispatch:
  push:
    branches: [android-device-flow-v1]
    paths: ["android/**", ".github/workflows/myfist-android-stable.yml"]

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Use project debug key
        run: |
          mkdir -p "$HOME/.android"
          base64 -d android/ci/myfist-debug.keystore.b64 > "$HOME/.android/debug.keystore"
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey \
            | grep -E 'SHA256:|Alias name:'
      - name: Set monotonic update-test version
        shell: bash
        run: |
          set -euo pipefail
          VERSION_CODE=$((60000 + GITHUB_RUN_NUMBER))
          VERSION_NAME="0.0.${VERSION_CODE}"
          sed -Ei "s/versionCode = [0-9]+/versionCode = ${VERSION_CODE}/" android/app/build.gradle.kts
          sed -Ei "s/versionName = \"[^\"]+\"/versionName = \"${VERSION_NAME}\"/" android/app/build.gradle.kts
          echo "MyFist versionCode=${VERSION_CODE} versionName=${VERSION_NAME}"
          grep -E 'version(Code|Name)' android/app/build.gradle.kts
      - name: Build
        working-directory: android
        run: gradle --no-daemon lintDebug testDebugUnitTest assembleDebug
      - name: Verify APK signature and version
        shell: bash
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -n 1
      - name: Prepare APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/MyFist.apk
          sha256sum android/app/build/outputs/apk/debug/MyFist.apk > android/app/build/outputs/apk/debug/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: MyFist-Android-Stable
          path: |
            android/app/build/outputs/apk/debug/MyFist.apk
            android/app/build/outputs/apk/debug/SHA256SUMS.txt
