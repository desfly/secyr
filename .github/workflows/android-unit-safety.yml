name: Android Unit Safety

on:
  pull_request:
    branches: [main]
    paths:
      - "android/app/src/main/java/ua/homeguard/s3/model/**"
      - "android/app/src/main/java/ua/homeguard/s3/navigation/**"
      - "android/app/src/main/java/ua/homeguard/s3/network/HttpDeviceApi.kt"
      - "android/app/src/test/**"
      - "android/app/build.gradle.kts"
      - ".github/workflows/android-unit-safety.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-unit-safety:
    name: Identity, navigation and command policy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Run Android JVM unit tests
        working-directory: android
        run: gradle --no-daemon --stacktrace testDebugUnitTest
