name: Decode component library cards

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  decode-cards:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode staged PDF cards
        shell: bash
        run: |
          set -euo pipefail
          changed=0
          shopt -s nullglob
          for f in hardware/component-library/cards/*.pdf.b64; do
            out="${f%.b64}"
            base64 --decode "$f" > "$out"
            rm "$f"
            echo "Decoded $out"
            changed=1
          done
          if [ "$changed" -eq 0 ]; then
            echo "No staged cards to decode"
          fi

      - name: Commit decoded cards
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hardware/component-library/cards
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "hardware: decode approved component PDF cards"
          git push origin HEAD:main
