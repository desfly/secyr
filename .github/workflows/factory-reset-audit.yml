name: Factory Reset Coverage Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "firmware/esp-idf/main/hg_factory_reset.cpp"
      - "firmware/esp-idf/main/hg_commissioning_nvs.cpp"
      - "firmware/esp-idf/components/nvs_config_store/**"
      - "tools/check_factory_reset_coverage.py"
      - ".github/workflows/factory-reset-audit.yml"
  pull_request:
    branches: [main]
    paths:
      - "firmware/esp-idf/main/hg_factory_reset.cpp"
      - "firmware/esp-idf/main/hg_commissioning_nvs.cpp"
      - "firmware/esp-idf/components/nvs_config_store/**"
      - "tools/check_factory_reset_coverage.py"
      - ".github/workflows/factory-reset-audit.yml"

permissions:
  contents: read

jobs:
  factory-reset-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Verify mutable and immutable reset boundaries
        run: python tools/check_factory_reset_coverage.py
