name: One-shot RBAC command state fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-rbac-command-state.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Preserve role-gated command state
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('web/app.js')
          s = p.read_text(encoding='utf-8')
          old = '''  const buttons = [...document.querySelectorAll("[data-command]")];
          buttons.forEach(item => { item.disabled = true; });'''
          new = '''  const buttons = [...document.querySelectorAll("[data-command]")];
          const previousDisabled = new Map(buttons.map(item => [item, item.disabled]));
          buttons.forEach(item => { item.disabled = true; });'''
          if old not in s:
              raise SystemExit('expected sendSecurityCommand prelude not found')
          s = s.replace(old, new, 1)
          old2 = '''    buttons.forEach(item => { item.disabled = false; });'''
          new2 = '''    buttons.forEach(item => { item.disabled = previousDisabled.get(item) === true; });'''
          if old2 not in s:
              raise SystemExit('expected sendSecurityCommand cleanup not found')
          s = s.replace(old2, new2, 1)
          p.write_text(s, encoding='utf-8')
          PY
          rm .github/workflows/fix-rbac-command-state.yml
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/app.js .github/workflows/fix-rbac-command-state.yml
          git diff --cached --check
          git commit -m "Preserve RBAC state after security commands"
          git push origin HEAD:main
