name: HomeGuard-S3 Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "firmware/**"
      - "android/**"
      - "web/**"
      - "tools/**"
      - "tests/**"
      - "docs/**"
      - ".github/workflows/homeguard-build.yml"
  pull_request:
    branches: [main]
    paths:
      - "firmware/**"
      - "android/**"
      - "web/**"
      - "tools/**"
      - "tests/**"
      - "docs/**"
      - ".github/workflows/homeguard-build.yml"

permissions:
  contents: read

concurrency:
  group: homeguard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-gates:
    name: Host validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ ninja-build

      - name: Project preflight
        run: python tools/preflight_build0022.py

      - name: ESP-IDF source audit
        run: python tools/audit_esp_idf_sources.py

      - name: Component dependency audit
        run: python tools/audit_component_dependencies.py

      - name: GPIO safety audit
        run: python tools/audit_gpio_safety.py

      - name: Firmware partition budget
        run: python tools/check_firmware_budget.py

      - name: Mock syntax
        run: python tools/syntax_check_esp_idf_mock.py

      - name: Mock compile and link
        run: python tools/mock_link_esp_idf_main.py

      - name: Upload host diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HomeGuard-S3-host-diagnostics
          path: |
            mock-syntax-report.json
            mock-link-report.json
            firmware-budget.json
            release-readiness-build0025.json
          if-no-files-found: warn

  esp-idf-build:
    name: ESP-IDF 5.4.4 firmware
    needs: host-gates
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install ESP-IDF 5.4.4
        uses: espressif/install-esp-idf-action@v1
        with:
          version: "v5.4.4"

      - name: Show toolchain versions
        run: |
          idf.py --version
          cmake --version
          ninja --version
          python --version

      - name: Configure ESP32-S3 target
        working-directory: firmware/esp-idf
        run: idf.py set-target esp32s3

      - name: Build firmware
        working-directory: firmware/esp-idf
        shell: bash
        run: |
          set -o pipefail
          idf.py build 2>&1 | tee firmware-build.log

      - name: Generate firmware checksums
        if: success()
        working-directory: firmware/esp-idf
        shell: bash
        run: |
          find build -type f \( -name "*.bin" -o -name "*.elf" -o -name "*.map" \) -print0 \
            | sort -z \
            | xargs -0 sha256sum > build/SHA256SUMS.txt

      - name: Upload ESP-IDF diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HomeGuard-S3-ESP-IDF-diagnostics
          path: |
            firmware/esp-idf/firmware-build.log
            firmware/esp-idf/sdkconfig
            firmware/esp-idf/build/CMakeCache.txt
            firmware/esp-idf/build/project_description.json
            firmware/esp-idf/build/flasher_args.json
            firmware/esp-idf/build/flash_args
            firmware/esp-idf/build/compile_commands.json
          if-no-files-found: warn

      - name: Upload firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HomeGuard-S3-firmware
          path: |
            firmware/esp-idf/build/*.bin
            firmware/esp-idf/build/*.elf
            firmware/esp-idf/build/*.map
            firmware/esp-idf/build/bootloader/*.bin
            firmware/esp-idf/build/partition_table/*.bin
            firmware/esp-idf/build/ota_data_initial.bin
            firmware/esp-idf/build/flasher_args.json
            firmware/esp-idf/build/flash_args
            firmware/esp-idf/build/SHA256SUMS.txt
          if-no-files-found: error

  android-build:
    name: Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build Android debug APK
        working-directory: android
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Generate APK checksum
        if: success()
        shell: bash
        run: sha256sum android/app/build/outputs/apk/debug/*.apk > android/app/build/outputs/apk/debug/SHA256SUMS.txt

      - name: Upload Android APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HomeGuard-S3-Android
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error

      - name: Upload Android diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: HomeGuard-S3-Android-diagnostics
          path: |
            android/.gradle/**
            android/app/build/reports/**
          if-no-files-found: warn

  test-candidate:
    name: Build-0057 ESP + Android provisioning test candidate
    needs: [esp-idf-build, android-build]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout instructions
        uses: actions/checkout@v5

      - name: Download firmware artifact
        uses: actions/download-artifact@v4
        with:
          name: HomeGuard-S3-firmware
          path: test-candidate/firmware

      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: HomeGuard-S3-Android
          path: test-candidate/android

      - name: Add test instructions and package checksums
        shell: bash
        run: |
          cp docs/BUILD-0057-TEST-CANDIDATE.txt test-candidate/README-FIRST.txt
          find test-candidate -type f ! -name SHA256SUMS-TEST-CANDIDATE.txt -print0 \
            | sort -z \
            | xargs -0 sha256sum > test-candidate/SHA256SUMS-TEST-CANDIDATE.txt

      - name: Upload combined test candidate
        uses: actions/upload-artifact@v4
        with:
          name: HomeGuard-S3-Build-0057-TEST-CANDIDATE
          path: test-candidate/
          if-no-files-found: error
