name: HomeGuard-S3 Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "firmware/**"
      - "android/**"
      - "web/**"
      - "tools/**"
      - "tests/**"
      - ".github/workflows/homeguard-build.yml"
  pull_request:
    branches: [main]
    paths:
      - "firmware/**"
      - "android/**"
      - "web/**"
      - "tools/**"
      - "tests/**"
      - ".github/workflows/homeguard-build.yml"

permissions:
  contents: read

concurrency:
  group: homeguard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-gates:
    name: Host validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ ninja-build
      - name: Project preflight
        run: python tools/preflight_build0022.py
      - name: ESP-IDF source audit
        run: python tools/audit_esp_idf_sources.py
      - name: Component dependency audit
        run: python tools/audit_component_dependencies.py
      - name: GPIO safety audit
        run: python tools/audit_gpio_safety.py
      - name: Firmware partition budget
        run: python tools/check_firmware_budget.py
      - name: Host unit tests
        shell: bash
        run: |
          set -euo pipefail
          cmake -S firmware -B build-host -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-host
          ctest --test-dir build-host --output-on-failure
      - name: Web UI contract
        run: python tools/check_web_ui_contract.py
      - name: Web field acceptance
        run: python tools/check_field_acceptance_web.py
      - name: Factory Reset contract
        run: python tools/check_factory_reset_contract.py
      - name: LAN UI/API contract
        run: python tools/check_lan_ui_contract.py
      - name: Android LAN discovery contract
        run: python tools/check_android_discovery_contract.py
      - name: Android field acceptance
        run: python tools/check_android_field_acceptance.py
      - name: Cloud runtime contract
        run: python tools/check_cloud_runtime_contract.py
      - name: Web UI JavaScript syntax
        run: node --check web/app.js && node --check web/access-session.js
      - name: Web UI browser boot smoke
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 8765 --directory web >/tmp/homeguard-web.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 1
          google-chrome --headless --no-sandbox --disable-gpu --virtual-time-budget=3000 --dump-dom http://127.0.0.1:8765/ > /tmp/homeguard-dom.html
          grep -q 'data-homeguard-ui="ready"' /tmp/homeguard-dom.html
      - name: Web UI control click smoke
        shell: bash
        run: |
          set -euo pipefail
          rm -f web-control-smoke.jsonl
          python tools/web_control_smoke_server.py serve --web web --log web-control-smoke.jsonl --port 8766 >/tmp/homeguard-control-smoke-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do if curl -fsS http://127.0.0.1:8766/api/v1/build >/dev/null; then break; fi; sleep 0.1; done
          google-chrome --headless --no-sandbox --disable-gpu --virtual-time-budget=12000 --dump-dom http://127.0.0.1:8766/ > /tmp/homeguard-control-dom.html
          grep -q 'data-homeguard-control-smoke="done"' /tmp/homeguard-control-dom.html
          python tools/web_control_smoke_server.py verify --log web-control-smoke.jsonl
      - name: Mock syntax
        run: python tools/syntax_check_esp_idf_mock.py
      - name: Mock compile and link
        run: python tools/mock_link_esp_idf_main.py
      - name: Upload host diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HomeGuard-S3-host-diagnostics
          path: |
            mock-syntax-report.json
            mock-link-report.json
            firmware-budget.json
            release-readiness-build0025.json
            web-control-smoke.jsonl
          if-no-files-found: warn

  esp-idf-build:
    name: ESP-IDF 5.4.4 firmware
    needs: host-gates
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: espressif/idf:v5.4.4
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Show toolchain versions
        shell: bash
        run: |
          source "$IDF_PATH/export.sh"
          idf.py --version
          cmake --version
          ninja --version
          python --version
      - name: Configure ESP32-S3 target
        working-directory: firmware/esp-idf
        shell: bash
        run: |
          source "$IDF_PATH/export.sh"
          idf.py set-target esp32s3
      - name: Build firmware
        working-directory: firmware/esp-idf
        shell: bash
        run: |
          set -o pipefail
          source "$IDF_PATH/export.sh"
          idf.py build 2>&1 | tee firmware-build.log
      - name: Generate firmware checksums
        if: success()
        working-directory: firmware/esp-idf
        shell: bash
        run: |
          find build -type f \( -name "*.bin" -o -name "*.elf" -o -name "*.map" \) -print0 | sort -z | xargs -0 sha256sum > build/SHA256SUMS.txt
      - name: Upload ESP-IDF diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HomeGuard-S3-ESP-IDF-diagnostics
          path: |
            firmware/esp-idf/firmware-build.log
            firmware/esp-idf/sdkconfig
            firmware/esp-idf/build/CMakeCache.txt
            firmware/esp-idf/build/project_description.json
            firmware/esp-idf/build/flasher_args.json
            firmware/esp-idf/build/flash_args
            firmware/esp-idf/build/compile_commands.json
          if-no-files-found: warn
      - name: Upload firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HomeGuard-S3-firmware
          path: |
            firmware/esp-idf/build/*.bin
            firmware/esp-idf/build/*.elf
            firmware/esp-idf/build/*.map
            firmware/esp-idf/build/bootloader/*.bin
            firmware/esp-idf/build/partition_table/*.bin
            firmware/esp-idf/build/ota_data_initial.bin
            firmware/esp-idf/build/flasher_args.json
            firmware/esp-idf/build/flash_args
            firmware/esp-idf/build/SHA256SUMS.txt
          if-no-files-found: error

  android-build:
    name: Android debug APK
    needs: host-gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Restore stable Android debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: homeguard-android-debug-keystore-v2
      - name: Ensure stable Android debug signing key exists
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [[ ! -s "$HOME/.android/debug.keystore" ]]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi
          test -s "$HOME/.android/debug.keystore"
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey \
            | grep -E 'SHA256:|Valid from:'
      - name: Test Android access policy and build debug APK
        working-directory: android
        run: gradle --no-daemon --stacktrace testDebugUnitTest assembleDebug
      - name: Prepare and verify MyFist installer
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          source_apk=$(find android/app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' ! -name 'MyFist.apk' | head -n 1)
          test -n "$source_apk"
          cp "$source_apk" android/app/build/outputs/apk/debug/MyFist.apk
          APK=android/app/build/outputs/apk/debug/MyFist.apk
          test -s "$APK"
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$SDK_ROOT"
          APKSIGNER=$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee android/app/build/outputs/apk/debug/APKSIGNER-VERIFY.txt
          sha256sum "$APK" > android/app/build/outputs/apk/debug/SHA256SUMS.txt
      - name: Upload Android APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MyFist-Android
          path: |
            android/app/build/outputs/apk/debug/MyFist.apk
            android/app/build/outputs/apk/debug/SHA256SUMS.txt
            android/app/build/outputs/apk/debug/APKSIGNER-VERIFY.txt
          if-no-files-found: error
      - name: Upload Android diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: MyFist-Android-diagnostics
          path: |
            android/.gradle/**
            android/app/build/reports/**
            android/app/build/test-results/**
            android/app/build/outputs/apk/debug/APKSIGNER-VERIFY.txt
          if-no-files-found: warn
