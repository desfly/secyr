name: Apply Android active device delete fix

on:
  push:
    branches: [ main ]
    paths:
      - .github/workflows/android-fix-device-delete-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Patch coordinated device deletion
        shell: python
        run: |
          from pathlib import Path

          screen = Path('android/app/src/main/java/ua/homeguard/s3/ui/screens/DeviceListScreen.kt')
          text = screen.read_text(encoding='utf-8')
          text = text.replace('import androidx.compose.runtime.rememberCoroutineScope\n', '')
          text = text.replace('import kotlinx.coroutines.launch\n', '')
          text = text.replace('import ua.homeguard.s3.storage.RegisteredDeviceStore\n', '')
          text = text.replace(
              '    onRenameDevice: (RegisteredDevice, String) -> Unit,\n    onOpenDevice: (RegisteredDevice) -> Unit,\n',
              '    onRenameDevice: (RegisteredDevice, String) -> Unit,\n    onDeleteDevice: (RegisteredDevice) -> Unit,\n    onOpenDevice: (RegisteredDevice) -> Unit,\n',
          )
          text = text.replace('    val scope = rememberCoroutineScope()\n', '')
          old = '''                    onClick = {\n                        scope.launch {\n                            RegisteredDeviceStore.removeActive(device.deviceId)\n                            if (expandedId == device.deviceId) expandedId = null\n                            deleteDevice = null\n                        }\n                    },\n'''
          new = '''                    onClick = {\n                        onDeleteDevice(device)\n                        if (expandedId == device.deviceId) expandedId = null\n                        deleteDevice = null\n                    },\n'''
          if old not in text:
              raise SystemExit('DeviceListScreen delete block not found')
          text = text.replace(old, new, 1)
          screen.write_text(text, encoding='utf-8')

          main = Path('android/app/src/main/java/ua/homeguard/s3/MainActivity.kt')
          text = main.read_text(encoding='utf-8')
          anchor = '''                        onRenameDevice = { device, newName ->\n                            lifecycleScope.launch { registeredDevices.rename(device.deviceId, newName) }\n                        },\n                        onOpenDevice = { device ->\n'''
          replacement = '''                        onRenameDevice = { device, newName ->\n                            lifecycleScope.launch { registeredDevices.rename(device.deviceId, newName) }\n                        },\n                        onDeleteDevice = { device ->\n                            lifecycleScope.launch {\n                                registeredDevices.remove(device.deviceId)\n                                if (settings.settings.value.deviceId == device.deviceId) {\n                                    settings.selectDevice(\"\")\n                                    accessSession.value = null\n                                    operatorPin.value = \"\"\n                                }\n                            }\n                        },\n                        onOpenDevice = { device ->\n'''
          if anchor not in text:
              raise SystemExit('MainActivity DeviceListScreen anchor not found')
          text = text.replace(anchor, replacement, 1)
          main.write_text(text, encoding='utf-8')

      - name: Compile Android tests and APK
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate Android
        working-directory: android
        run: gradle testDebugUnitTest assembleDebug --stacktrace

      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android/app/src/main/java/ua/homeguard/s3/MainActivity.kt android/app/src/main/java/ua/homeguard/s3/ui/screens/DeviceListScreen.kt
          if git diff --cached --quiet; then
            echo 'No changes'
            exit 0
          fi
          git commit -m 'android: clear active selection when deleting device'
          git push origin HEAD:main
