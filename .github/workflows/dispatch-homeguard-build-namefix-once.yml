name: Dispatch HomeGuard build for naming fix

on:
  push:
    branches: [ main ]
    paths:
      - .github/workflows/dispatch-homeguard-build-namefix-once.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch HomeGuard-S3 Build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run homeguard-build.yml --repo ${{ github.repository }} --ref main
