name: Android Field Acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - "android/**"
      - "tools/check_android_field_acceptance.py"
      - ".github/workflows/android-field-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-field-acceptance:
    name: Device list, dedup, picons, reset
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Verify Android field acceptance contract
        run: python tools/check_android_field_acceptance.py
