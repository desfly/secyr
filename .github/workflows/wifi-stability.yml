name: HomeGuard Wi-Fi Stability

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: homeguard-wifi-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wifi-contract:
    name: Wi-Fi HTTP/socket contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Wi-Fi runtime contract
        run: python tools/check_wifi_runtime_contract.py
      - name: Access boundary audit
        run: python tools/check_access_boundary.py
      - name: Firmware preflight
        run: python tools/preflight_firmware.py
      # Firmware compilation/linking is authoritative in HomeGuard-S3 Build using ESP-IDF 5.4.4.
      # Do not duplicate it with the legacy host mock SDK; that mock does not model
      # components such as esp_https_server and can false-fail valid firmware.
      - name: Web JavaScript syntax
        run: node --check web/app.js && node --check web/access-session.js && node --check web/factory-reset.js
