name: Apply Android discovered device naming fix

on:
  push:
    branches: [ main ]
    paths:
      - .github/workflows/android-fix-discovered-device-name-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Patch discovered-device registration flow
        shell: python
        run: |
          from pathlib import Path

          screen = Path('android/app/src/main/java/ua/homeguard/s3/ui/screens/AddDeviceScreen.kt')
          text = screen.read_text(encoding='utf-8')
          text = text.replace(
              '    onUseDevice: (DiscoveredDevice) -> Unit,\n',
              '    onUseDevice: (DiscoveredDevice, String) -> Unit,\n',
          )
          text = text.replace(
              '    var manualAddressTouched by remember { mutableStateOf(false) }\n',
              '    var manualAddressTouched by remember { mutableStateOf(false) }\n    var selectedDiscoveredDevice by remember { mutableStateOf<DiscoveredDevice?>(null) }\n',
          )
          old = '''                OutlinedButton(\n                    onClick = {\n                        manualAddress = device.host\n                        manualAddressTouched = false\n                        onUseDevice(device)\n                    },\n                    modifier = Modifier.fillMaxWidth(),\n                ) {\n'''
          new = '''                OutlinedButton(\n                    onClick = {\n                        selectedDiscoveredDevice = device\n                        manualAddress = device.host\n                        manualAddressTouched = false\n                        manualExpanded = true\n                    },\n                    modifier = Modifier.fillMaxWidth(),\n                ) {\n'''
          if old not in text:
              raise SystemExit('discovered device button anchor not found')
          text = text.replace(old, new, 1)

          anchor = '''            Button(\n                onClick = { onUseManualAddress(manualName.trim().ifBlank { "HomeGuard" }, manualAddress) },\n                enabled = manualAddress.isNotBlank(),\n                modifier = Modifier.fillMaxWidth(),\n            ) { Text("Додати за IP") }\n\n            Text("або", style = MaterialTheme.typography.bodyMedium)\n'''
          replacement = '''            selectedDiscoveredDevice?.let { selected ->\n                Button(\n                    onClick = { onUseDevice(selected, manualName.trim().ifBlank { selected.serviceName.ifBlank { "HomeGuard" } }) },\n                    modifier = Modifier.fillMaxWidth(),\n                ) { Text("Додати знайдений пристрій") }\n                Text(\n                    "Знайдено: ${selected.host}:${selected.port}. Назву можна змінити перед додаванням.",\n                    style = MaterialTheme.typography.bodySmall,\n                )\n            }\n            Button(\n                onClick = { onUseManualAddress(manualName.trim().ifBlank { "HomeGuard" }, manualAddress) },\n                enabled = manualAddress.isNotBlank(),\n                modifier = Modifier.fillMaxWidth(),\n            ) { Text("Додати за IP") }\n\n            Text("або", style = MaterialTheme.typography.bodyMedium)\n'''
          if anchor not in text:
              raise SystemExit('manual add button anchor not found')
          text = text.replace(anchor, replacement, 1)
          screen.write_text(text, encoding='utf-8')

          main = Path('android/app/src/main/java/ua/homeguard/s3/MainActivity.kt')
          text = main.read_text(encoding='utf-8')
          old = '''                        onUseDevice = { device ->\n                            lifecycleScope.launch {\n                                registeredDevices.addOrUpdate(device)\n                                settings.remember(device)\n                                addDeviceOpen.value = false\n                                deviceListOpen.value = true\n                            }\n                        },\n'''
          new = '''                        onUseDevice = { device, name ->\n                            lifecycleScope.launch {\n                                registeredDevices.addOrUpdate(device, requestedName = name)\n                                settings.remember(device)\n                                addDeviceOpen.value = false\n                                deviceListOpen.value = true\n                            }\n                        },\n'''
          if old not in text:
              raise SystemExit('MainActivity onUseDevice anchor not found')
          text = text.replace(old, new, 1)
          main.write_text(text, encoding='utf-8')

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate Android code
        working-directory: android
        run: gradle testDebugUnitTest compileDebugKotlin --stacktrace

      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android/app/src/main/java/ua/homeguard/s3/MainActivity.kt android/app/src/main/java/ua/homeguard/s3/ui/screens/AddDeviceScreen.kt
          if git diff --cached --quiet; then
            echo 'No changes'
            exit 0
          fi
          git commit -m 'android: let user name discovered device before adding'
          git push origin HEAD:main
