name: Fix setup password eyes once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-setup-password-eyes-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch source-owned password eye controls
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path('web/access-session.js')
          s = p.read_text(encoding='utf-8')

          marker = '  function showLogin(prefill = "") {'
          if 'function attachPasswordEye(' not in s:
              helper = r'''  function attachPasswordEye(inputId, labelText) {
    const input = document.getElementById(inputId);
    if (!input || document.getElementById(inputId + "Eye")) return;
    const label = input.closest("label");
    if (!label) return;

    label.style.position = "relative";
    input.style.setProperty("padding-right", "52px", "important");

    const button = document.createElement("button");
    button.id = inputId + "Eye";
    button.type = "button";
    button.setAttribute("aria-label", labelText);
    button.setAttribute("aria-pressed", "false");
    button.title = labelText;
    button.innerHTML = '<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/></svg>';

    const important = {
      position: "absolute", right: "8px", bottom: "7px", width: "36px", height: "36px",
      "min-height": "36px", margin: "0", padding: "0", border: "0",
      background: "transparent", color: "#ffffff", "border-radius": "6px",
      "line-height": "1", "z-index": "4", display: "grid", "place-items": "center"
    };
    for (const [name, value] of Object.entries(important)) button.style.setProperty(name, value, "important");

    button.addEventListener("click", () => {
      const show = input.type === "password";
      input.type = show ? "text" : "password";
      button.setAttribute("aria-pressed", show ? "true" : "false");
      button.title = show ? "Сховати пароль" : labelText;
      input.focus();
      const end = input.value.length;
      if (typeof input.setSelectionRange === "function") input.setSelectionRange(end, end);
    });
    label.appendChild(button);
  }

'''
              if marker not in s:
                  raise SystemExit('showLogin marker not found')
              s = s.replace(marker, helper + marker, 1)

          login_old = '    form.querySelector("input")?.focus();'
          login_new = '    attachPasswordEye("hgLoginPin", "Показати пароль / PIN");\n    form.querySelector("input")?.focus();'
          if 'attachPasswordEye("hgLoginPin"' not in s:
              if login_old not in s:
                  raise SystemExit('login focus marker not found')
              s = s.replace(login_old, login_new, 1)

          setup_old = '    form.querySelector("#hgSetupWifiScan")?.focus();'
          setup_new = '    attachPasswordEye("hgSetupWifiPassword", "Показати пароль Wi-Fi");\n    attachPasswordEye("hgSetupPin", "Показати пароль / PIN");\n    form.querySelector("#hgSetupWifiScan")?.focus();'
          if 'attachPasswordEye("hgSetupWifiPassword"' not in s:
              if setup_old not in s:
                  raise SystemExit('setup focus marker not found')
              s = s.replace(setup_old, setup_new, 1)

          p.write_text(s, encoding='utf-8')

          idx = Path('web/index.html')
          html = idx.read_text(encoding='utf-8')
          html = html.replace('/access-session.js?v=285', '/access-session.js?v=286')
          idx.write_text(html, encoding='utf-8')

          test = Path('tools/check_setup_ui_contract.py')
          t = test.read_text(encoding='utf-8')
          if 'source-owned setup password eye controls' not in t:
              insert = '''\n# Source-owned setup password eye controls: runtime form and controls live together.\nfor required in (\n    'function attachPasswordEye(',\n    'attachPasswordEye("hgSetupWifiPassword",',\n    'attachPasswordEye("hgSetupPin",',\n    'attachPasswordEye("hgLoginPin",',\n    'input.style.setProperty("padding-right", "52px", "important")',\n):\n    require(required in source, f"source-owned setup password eye control missing: {required}")\n\n'''
              pos = t.find('if errors:')
              if pos < 0:
                  raise SystemExit('test insertion marker not found')
              t = t[:pos] + insert + t[pos:]
              test.write_text(t, encoding='utf-8')
          PY

          python tools/check_setup_ui_contract.py
          git diff --check

      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/access-session.js web/index.html tools/check_setup_ui_contract.py
          git commit -m "fix(web): make setup password eyes source-owned and visible"
          git push origin HEAD:main
