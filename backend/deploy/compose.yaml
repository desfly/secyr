services:
  signer:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:size=16m,mode=1777
    volumes:
      - type: bind
        source: ${SIGNER_SECRETS_DIR:?Set the absolute directory containing signer.json and PEM keys}
        target: /run/homeguard
        read_only: true
        bind:
          create_host_path: false
      - signer_state:/state
    networks: [private]

  https:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SIGNER_DOMAIN: ${SIGNER_DOMAIN:?Set the public DNS name of this service}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [private, public]
    depends_on: [signer]

networks:
  private:
    internal: true
  public:

volumes:
  signer_state:
    external: true
    name: homeguard_signer_state
  caddy_data:
    external: true
    name: homeguard_signer_caddy_data
  caddy_config:
