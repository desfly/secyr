name: ESP-IDF Build-0022

on:
  workflow_dispatch:
  push:
    paths:
      - "firmware/**"
      - "tools/preflight_build0022.py"
      - "tools/generate_firmware_manifest.py"
      - ".github/workflows/esp-idf-build-0022.yml"
  pull_request:
    paths:
      - "firmware/**"
      - "tools/**"

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Preflight
        run: python tools/preflight_build0022.py

  firmware:
    needs: preflight
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.4.2

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        working-directory: firmware/esp-idf
        run: |
          idf.py set-target esp32s3
          idf.py reconfigure

      - name: Build
        working-directory: firmware/esp-idf
        run: idf.py build

      - name: Collect release
        run: |
          mkdir -p release-build0022
          cp firmware/esp-idf/build/bootloader/bootloader.bin release-build0022/
          cp firmware/esp-idf/build/partition_table/partition-table.bin release-build0022/
          cp firmware/esp-idf/build/homeguard_s3.bin release-build0022/
          cp firmware/esp-idf/build/flasher_args.json release-build0022/
          cp firmware/esp-idf/build/flash_args release-build0022/
          if [ -f firmware/esp-idf/build/ota_data_initial.bin ]; then
            cp firmware/esp-idf/build/ota_data_initial.bin release-build0022/
          fi
          sha256sum release-build0022/* > release-build0022/SHA256SUMS.txt
          python tools/generate_firmware_manifest.py \
            release-build0022 \
            release-build0022/manifest.json

      - name: Upload release
        uses: actions/upload-artifact@v4
        with:
          name: HomeGuard-S3-Build-0022-firmware
          path: release-build0022
          if-no-files-found: error
